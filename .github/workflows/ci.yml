name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1:控制面(Python) ──────────────────────────────
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
      # 认证安全测试使用真实 PostgreSQL 和 Redis;conftest 准备 kongming_test 库。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kongming
          POSTGRES_USER: kongming
          POSTGRES_PASSWORD: kongming
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kongming"
          --health-interval 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy kongming
      # pyright 参数与本地 make api-check 一致。
      - run: uv run pyright
      - run: uv run lint-imports
      # baseline 迁移对 km_readonly 无条件 GRANT(0001),角色由 pg-init 创建;
      # 本地 compose 挂载同款 init 脚本,CI 此处与其同构(单源,不复制 SQL)
      - run: >
          psql "postgres://kongming:kongming@localhost:5432/kongming"
          -v ON_ERROR_STOP=1 -f ../../infra/pg-init/001-readonly-role.sql
      - run: uv run pytest -q --cov

  # ── 门禁 2:Agent 面(Python,零凭证纪律) ────────────────
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy kongming_agent
      # pyright 参数与本地 make agent-check 一致。
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -q --cov

  # ── 门禁 3:连弩引擎(packages/liannu 独立包) ────────────
  liannu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/liannu
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy liannu
      - run: uv run pytest -q --cov

  # ── 门禁 4:前端(TypeScript) ────────────────────────────
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm format:check
      - run: pnpm build

  # ── 门禁 5:契约漂移(ADR-005) ──────────────────────────
  # 重新导出 OpenAPI 后 diff,防"改了代码忘了导出契约"
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      # 复用本地 make check，确保 CI 与本地执行相同的契约检查。
      - run: make -C ../.. contracts-check

  # ── 镜像构建（只构建，用于检查 Dockerfile 和路径依赖）──
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f infra/api.Dockerfile -t kongming-api:ci .
      - name: Build agent image
        run: docker build -f infra/agent.Dockerfile -t kongming-agent:ci .
