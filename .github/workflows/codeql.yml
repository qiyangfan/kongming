name: codeql

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/agent/**"
      - "packages/liannu/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/agent/**"
      - "packages/liannu/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@096a89ea781ad15884828b1490898d6948bd1605 # v3.39.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@096a89ea781ad15884828b1490898d6948bd1605 # v3.39.3
