# 手动运行的评估门禁，使用真实 API 凭证，结果可能受模型输出波动影响。
# 仅 workflow_dispatch 手动触发——个人项目不设 schedule,避免每日 LLM 费用
name: eval-nightly

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "评估层"
        type: choice
        options: [smoke, full, multiturn, retrieval]
        default: smoke

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require eval credentials
        env:
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
          KM_EVAL_ADMIN_PASSWORD: ${{ secrets.KM_EVAL_ADMIN_PASSWORD }}
        run: |
          if [ -z "$KM_AGENT_LLM_API_KEY" ]; then
            echo "::error::缺少评估用 LLM 凭证 secret KM_AGENT_LLM_API_KEY(显式失败,不静默跳过)"
            exit 1
          fi
          if [ -z "$KM_EVAL_ADMIN_PASSWORD" ]; then
            echo "::error::缺少评估用超管密码 secret KM_EVAL_ADMIN_PASSWORD(显式失败,不用内置默认值)"
            exit 1
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Start infrastructure
        env:
          KM_DB_PASSWORD: eval-only
          KM_INTERNAL_TOKEN: eval-only-internal
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
          KM_AGENT_LLM_BASE_URL: ${{ secrets.KM_AGENT_LLM_BASE_URL }}
          KM_AGENT_LLM_MODEL: ${{ vars.KM_AGENT_LLM_MODEL || 'qwen-plus' }}
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d postgres redis
          # 等健康
          for _ in $(seq 1 30); do
            docker compose -f infra/docker-compose.yml ps postgres | grep -q healthy && break
            sleep 2
          done

      - name: Install and migrate api
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Install agent
        working-directory: apps/agent
        run: uv sync --frozen

      - name: Start api + agent
        env:
          KM_DATABASE_URL: postgresql+asyncpg://kongming:eval-only@localhost:5432/kongming
          KM_REDIS_URL: redis://localhost:6379/0
          KM_INTERNAL_TOKEN: eval-only-internal
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
          KM_AGENT_LLM_BASE_URL: ${{ secrets.KM_AGENT_LLM_BASE_URL }}
          KM_AGENT_LLM_MODEL: ${{ vars.KM_AGENT_LLM_MODEL || 'qwen-plus' }}
          KM_AGENT_API_BASE_URL: http://127.0.0.1:8000
          KM_AGENT_INTERNAL_TOKEN: eval-only-internal
        run: |
          cd apps/api && uv run uvicorn kongming.main:app --port 8000 &
          cd apps/agent && uv run uvicorn kongming_agent.main:app --port 8001 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && curl -sf http://127.0.0.1:8001/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz || { echo "::error::api healthz 未就绪"; exit 1; }
          curl -sf http://127.0.0.1:8001/healthz || { echo "::error::agent healthz 未就绪"; exit 1; }

      - name: Clear eval caches (011 lesson)
        env:
          KM_DB_PASSWORD: eval-only
        run: |
          # 同题问答沉淀 + ragctx 缓存——否则验证的是缓存不是 prompt
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U kongming -d kongming -c "DELETE FROM rag.query_history;"
          docker compose -f infra/docker-compose.yml exec -T redis \
            sh -c "redis-cli --scan --pattern 'km:ragctx:*' | xargs -r -n1 redis-cli DEL"

      - name: Restore previous baseline
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        continue-on-error: true
        with:
          name: eval-baseline
          path: /tmp/eval-prev
      # 首次无基线:只记录不失败

      - name: Run evaluation layer
        env:
          KM_EVAL_ADMIN_PASSWORD: ${{ secrets.KM_EVAL_ADMIN_PASSWORD }}
          LAYER: ${{ github.event.inputs.layer || 'smoke' }}
        working-directory: apps/api
        run: |
          # 管道到 tee 会吞掉 pytest 退出码(默认 shell 无 pipefail),
          # 评估失败会静默变绿——显式开 pipefail
          set -euo pipefail
          # retrieval 层语料目录独立(与 NL2SQL 统计互不混入),目标路径不同
          if [ "$LAYER" = "retrieval" ]; then
            TARGET=evals/retrieval
          else
            TARGET=evals
          fi
          uv run pytest "$TARGET" -m "$LAYER" -q --tb=short | tee /tmp/eval-out.txt
          # 结构化指标与层/指纹写入基线产物(summary.json 供下次对比)
          mkdir -p /tmp/eval-now
          cp /tmp/eval-out.txt /tmp/eval-now/
          python3 ../../scripts/eval_redline.py summarize \
            /tmp/eval-out.txt "$LAYER" /tmp/eval-now/summary.json

      - name: Red-line compare (≥5pp drop fails)
        env:
          LAYER: ${{ github.event.inputs.layer || 'smoke' }}
        working-directory: apps/api
        run: |
          python3 ../../scripts/eval_redline.py compare \
            /tmp/eval-prev /tmp/eval-out.txt "$LAYER"

      # baseline 仅 2KB 文本且同名上传自动替换旧版;账号存储配额计量器卡死
      # 期间(2026-11 已知 bug)上传会被拒,不应拖红整个评估门禁。
      - name: Upload baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: eval-baseline
          path: /tmp/eval-now/
          retention-days: 30
