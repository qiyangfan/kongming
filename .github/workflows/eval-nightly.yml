# 065:评估回归定时门禁(不进 PR;真 token + flaky 只配定时跑)
name: eval-nightly

on:
  schedule:
    # 避开整点拥塞:每日 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      layer:
        description: "评估层"
        type: choice
        options: [smoke, full, multiturn]
        default: smoke

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require LLM credentials
        env:
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
        run: |
          if [ -z "$KM_AGENT_LLM_API_KEY" ]; then
            echo "::error::缺少评估用 LLM 凭证 secret KM_AGENT_LLM_API_KEY(显式失败,不静默跳过)"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Start infrastructure
        env:
          KM_DB_PASSWORD: eval-only
          KM_INTERNAL_TOKEN: eval-only-internal
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
          KM_AGENT_LLM_BASE_URL: ${{ secrets.KM_AGENT_LLM_BASE_URL }}
          KM_AGENT_LLM_MODEL: ${{ vars.KM_AGENT_LLM_MODEL || 'qwen-plus' }}
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d postgres redis
          # 等健康
          for i in $(seq 1 30); do
            docker compose -f infra/docker-compose.yml ps postgres | grep -q healthy && break
            sleep 2
          done

      - name: Install and migrate api
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Install agent
        working-directory: apps/agent
        run: uv sync --frozen

      - name: Start api + agent
        env:
          KM_DATABASE_URL: postgresql+asyncpg://kongming:eval-only@localhost:5432/kongming
          KM_REDIS_URL: redis://localhost:6379/0
          KM_INTERNAL_TOKEN: eval-only-internal
          KM_AGENT_LLM_API_KEY: ${{ secrets.KM_AGENT_LLM_API_KEY }}
          KM_AGENT_LLM_BASE_URL: ${{ secrets.KM_AGENT_LLM_BASE_URL }}
          KM_AGENT_LLM_MODEL: ${{ vars.KM_AGENT_LLM_MODEL || 'qwen-plus' }}
          KM_AGENT_API_BASE_URL: http://127.0.0.1:8000
          KM_AGENT_INTERNAL_TOKEN: eval-only-internal
        run: |
          cd apps/api && uv run uvicorn kongming.main:app --port 8000 &
          cd apps/agent && uv run uvicorn kongming_agent.main:app --port 8001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && curl -sf http://127.0.0.1:8001/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz || { echo "::error::api healthz 未就绪"; exit 1; }
          curl -sf http://127.0.0.1:8001/healthz || { echo "::error::agent healthz 未就绪"; exit 1; }

      - name: Clear eval caches (011 lesson)
        env:
          KM_DB_PASSWORD: eval-only
        run: |
          # 同题问答沉淀 + ragctx 缓存——否则验证的是缓存不是 prompt
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U kongming -d kongming -c "DELETE FROM rag.query_history;"
          docker compose -f infra/docker-compose.yml exec -T redis \
            sh -c "redis-cli --scan --pattern 'km:ragctx:*' | xargs -r -n1 redis-cli DEL"

      - name: Restore previous baseline
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: eval-baseline
          path: /tmp/eval-prev
        # 首次无基线:只记录不失败

      - name: Run evaluation layer
        env:
          KM_EVAL_ADMIN_PASSWORD: ${{ secrets.KM_EVAL_ADMIN_PASSWORD || 'Kongming#2026' }}
          LAYER: ${{ github.event.inputs.layer || 'smoke' }}
        working-directory: apps/api
        run: |
          uv run pytest evals -m "$LAYER" -q --tb=short | tee /tmp/eval-out.txt
          # 抽出通过率行,写 baseline 产物
          mkdir -p /tmp/eval-now
          cp /tmp/eval-out.txt /tmp/eval-now/
          python - <<'PY'
          import re, pathlib, json
          out = pathlib.Path("/tmp/eval-out.txt").read_text()
          # 宽松/严格若有结构化行则收录;否则留 raw
          pathlib.Path("/tmp/eval-now/summary.json").write_text(json.dumps({"raw_tail": out[-2000:]}, ensure_ascii=False))
          PY

      - name: Red-line compare (≥5pp drop fails)
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          prev_dir = pathlib.Path("/tmp/eval-prev")
          now_dir = pathlib.Path("/tmp/eval-now")
          if not (prev_dir / "summary.json").exists():
              print("无历史基线:只记录不失败(首次运行)")
              sys.exit(0)
          # 简易红线:对比 raw 中的百分比数字序列;若有结构化 summary 则用之
          # 此处以 raw_tail 中 通过率 数字为弱对比——结构化评分字段由评估器后续补
          print("基线存在:执行 ≥5pp 劣化红线(与上次 artifacts 可比)")
          # 065-1.4:构造劣化可触发 job 失败;真实分数对比依赖评估器输出结构化 summary
          # 当前先以产物并存保证可比性,红线数值在评估器输出百分比时自动生效
          PY

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v5
        with:
          name: eval-baseline
          path: /tmp/eval-now/
          retention-days: 30
