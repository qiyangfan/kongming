[project]
name = "liannu"
version = "0.1.4"
description = "Kongming SQL 安全引擎:单遍解析产出防火墙判定/schema 作用域/保留表/行级改写结构(PG 方言,纯计算零 IO)"
requires-python = ">=3.13"
dependencies = [
    "sqlglot>=26.0", # 与消费方 kongming 同族版本;AST 语义即防火墙语义
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liannu"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "ruff>=0.9",
]

# 覆盖率门禁(JaCoCo 同位):branch 模式 + fail_under 一票否决,阈值只升不降
[tool.coverage.run]
source = ["liannu"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

# 子包自带 lint 配置(ruff 按最近 pyproject.toml 生效);规则与消费方 apps/api 同款
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # pytest 惯例
