# 秘密扫描基线(gitleaks 默认规则 + 仓库内已核实非凭证的允许项)。
# 允许项只收紧到具体字面量/模式,不允许按路径整体豁免。
[extend]
useDefault = true

[allowlist]
description = "测试夹具、自指字段与第三方文档示例值:已核实非真实凭证"
regexes = [
  '''sk-abcdef0123456789abcdef01''',
  '''bot_key=bot_key''',
  '''question=body\.question''',
  # corpus_k8s 上游 Kubernetes 文档中的公开示例值
  '''dGlnZXI6cGFzczEyMzQ=''',
  '''QVFEQ1pMdFhPUnQrSmhBQUFYaERWNHJsZ3BsMmNjcDR6RFZST0E9PQ==''',
  '''AQDCZLtXORt\+JhAAAXhDV4rlgpl2ccp4zDVROA==''',
]
