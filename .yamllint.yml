extends: default

ignore: |
  .venv/
  node_modules/
  **/.venv/
  **/node_modules/
  **/dist/

rules:
  # Prettier 行尾注释只留 1 空格,两门禁不得互相打架
  comments:
    min-spaces-from-content: 1
  # 中文文档/YAML 描述普遍长行,不做强制折行
  line-length: disable
  # openspec/CI 根对象不以 --- 起头,该规则无收益
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
