[project]
name = "kongming-api"
version = "0.1.0"
description = "Kongming 控制面:持凭证、做安全决策(FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",              # 下限与锁文件中的 FastAPI 主版本保持一致。
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1,<3",  # asyncio extra 会安装 greenlet。
    "asyncpg>=0.30",
    "alembic>=1.20",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",          # RS256;ADR-003:不用 python-jose
    "authlib>=1.9",                 # GitHub OAuth
    "sqlglot>=30.0",                # SQL 防火墙 AST
    "redis>=8.1",
    "cryptography>=50.0",           # 数据源密码 AES-GCM
    "httpx>=0.28",                  # 回调 agent 面
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "jsonschema>=4.23",             # 校验工具参数。
    "liannu==0.1.4",                # 仓库共享的 SQL 安全引擎。
    "faster-whisper>=1.0",
    "mcp>=2.3,<3",                  # adopt-mcp-sdk2:MCP 官方 SDK 2.x(双向协议载体;dev→prod 迁移)
    "httpx2>=2,<3",                 # mcp 2.x 的 HTTP 栈,kongming/mcp/client.py 直接 import(直接导入须直接声明)
]

# liannu 是仓库共享包；升级时同步 packages/liannu/pyproject.toml 中的版本。
[tool.uv.sources]
liannu = { path = "../../packages/liannu" }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-Authlib>=1.4",
    "import-linter>=2.2",
    "types-openpyxl>=3.1.5.20260807",
    "types-jsonschema>=4.23",  # 工具参数校验类型声明。
    "pyyaml>=6.0",  # 解析 evals/ 中的评估数据，不属于产品依赖。
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # DDL 行折叠伤可读性,版本文件放开行宽
"tests/*" = ["S101", "S105", "S106", "S107"]  # pytest 惯例;测试密码为道具非密钥
"evals/*" = ["S101", "S105", "S106", "S107"]  # 评估器同 pytest 惯例

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 会话级事件循环:engine/redis 客户端 lru_cache 单例与 asyncpg 连接绑定同一 loop
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
# 常规门禁只收集 tests/；评估用例需指定评估环境后单独运行。
testpaths = ["tests"]
# tests/ 下的匹配器单测 import evals.matchers(匹配器逻辑进默认门禁守护)
pythonpath = ["."]
markers = [
    "smoke: 评估集 smoke 子集(约5题,评估环境显式触发)",
    "full: 评估集全量单轮(手动/预发,含动态数据源组)",
    "multiturn: 多轮上下文评估(指代/省略/排序延续/过滤追加)",
    "judge: judge 抽检层(092,非确定性产出 LLM 评审;随 smoke 层进定时门禁)",
    "retrieval: 文档检索质量评测(retrieval-eval;语料+multi-hop 评测集,评估环境显式触发)",
]

# authlib 官方存根不完整:AsyncOAuth2Client 的 httpx 继承方法(get/aclose)
# 运行时存在、存根未声明,provider 模块关闭 attr-defined(其余 strict 全开)
[[tool.mypy.overrides]]
module = "kongming.auth.providers.*"
disable_error_code = ["attr-defined"]

# asyncpg 无 py.typed 标记(直连仅测试连接一处消费,异常类 isinstance 判定不受影响)
[[tool.mypy.overrides]]
module = "kongming.datasource.tester"
disable_error_code = ["import-untyped"]

[tool.importlinter]
root_packages = ["kongming"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "auth 域不反向依赖业务域(ADR-003 回退路径前提)"
type = "forbidden"
source_modules = ["kongming.auth"]
# 必须填写真实包名，否则 import-linter 不会检查这些依赖。
forbidden_modules = ["kongming.chat", "kongming.rag", "kongming.datasource"]

[[tool.importlinter.contracts]]
name = "datascope 域不依赖 Web 框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = ["kongming.datascope"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "chat 领域模型/用例/端口/导出纯函数不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.chat.models",
    "kongming.chat.service",
    "kongming.chat.ports",
    "kongming.chat.export",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

