[project]
name = "kongming-api"
version = "0.1.0"
description = "Kongming 控制面:持凭证、做安全决策(FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",          # RS256;ADR-003:不用 python-jose
    "authlib>=1.4",                 # GitHub OAuth
    "sqlglot>=26.0",                # SQL 防火墙 AST
    "redis>=5.2",
    "cryptography>=44.0",           # 数据源密码 AES-GCM
    "httpx>=0.28",                  # 回调 agent 面(005)
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "jsonschema>=4.23",             # 019 工具参数 JSON Schema 校验(L4)
    "liannu==0.1.3",                # 053 SQL 安全引擎(单遍解析;monorepo 共享包 packages/liannu)
]

# 053:引擎为本仓共享包(packages/liannu,连弩),以 uv path 依赖引入;
# 升版 = packages/liannu/pyproject.toml 改版本号并同步本声明
[tool.uv.sources]
liannu = { path = "../../packages/liannu" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-Authlib>=1.4",
    "import-linter>=2.2",
    "types-openpyxl>=3.1.5.20260807",
    "types-jsonschema>=4.23",  # 019 工具参数校验 stub
    "pyyaml>=6.0",  # 评估器 gold 数据集解析(016;evals/ 工具面,不进产品依赖)
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # DDL 行折叠伤可读性,版本文件放开行宽
"tests/*" = ["S101", "S105", "S106", "S107"]  # pytest 惯例;测试密码为道具非密钥
"evals/*" = ["S101", "S105", "S106", "S107"]  # 评估器同 pytest 惯例(016)

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 会话级事件循环:engine/redis 客户端 lru_cache 单例与 asyncpg 连接绑定同一 loop
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
# 016 评估器与常规门禁隔离:默认收集只进 tests/(评估需评估环境,显式
# `uv run pytest evals -m smoke|full|multiturn` 运行,命令行参数覆盖本项)
testpaths = ["tests"]
# tests/ 下的匹配器单测 import evals.matchers(匹配器逻辑进默认门禁守护)
pythonpath = ["."]
markers = [
    "smoke: 评估集 smoke 子集(约5题,评估环境显式触发)",
    "full: 评估集全量单轮(手动/预发,含动态数据源组)",
    "multiturn: 多轮上下文评估(指代/省略/排序延续/过滤追加)",
]

# authlib 官方存根不完整:AsyncOAuth2Client 的 httpx 继承方法(get/aclose)
# 运行时存在、存根未声明,provider 模块关闭 attr-defined(其余 strict 全开)
[[tool.mypy.overrides]]
module = "kongming.auth.providers.*"
disable_error_code = ["attr-defined"]

# asyncpg 无 py.typed 标记(直连仅测试连接一处消费,异常类 isinstance 判定不受影响)
[[tool.mypy.overrides]]
module = "kongming.datasource.tester"
disable_error_code = ["import-untyped"]

[tool.importlinter]
root_packages = ["kongming"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "auth 域不反向依赖业务域(ADR-003 回退路径前提)"
type = "forbidden"
source_modules = ["kongming.auth"]
# kongming.datasource=008、kongming.rag=009 落地的真实包名(基线期猜测名
# datasource_admin/rag_admin 曾使防线对真实包静默失效,R1 实证;009 清偿挂账)
forbidden_modules = ["kongming.chat", "kongming.rag", "kongming.datasource"]

[[tool.importlinter.contracts]]
name = "datascope 域不依赖 Web 框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = ["kongming.datascope"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "chat 领域模型/用例/端口/导出纯函数不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.chat.models",
    "kongming.chat.service",
    "kongming.chat.ports",
    "kongming.chat.export",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

