[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kongming"]

# 覆盖率门禁(JaCoCo 同位):branch 模式 + fail_under 一票否决,阈值只升不降
# liannu 引擎不在本面计量:它有独立测试与门禁(make liannu-check),避免双重计分
[tool.coverage.run]
source = ["kongming"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
