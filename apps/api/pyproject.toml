[project]
name = "kongming-api"
version = "0.1.0"
description = "Kongming 控制面:持凭证、做安全决策(FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",          # RS256;ADR-003:不用 python-jose
    "authlib>=1.4",                 # GitHub OAuth
    "sqlglot>=26.0",                # SQL 防火墙 AST
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "cryptography>=44.0",           # 数据源密码 AES-GCM
    "httpx>=0.28",                  # 回调 agent 面(005)
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-Authlib>=1.4",
    "import-linter>=2.2",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # DDL 行折叠伤可读性,版本文件放开行宽
"tests/*" = ["S101", "S105", "S106", "S107"]  # pytest 惯例;测试密码为道具非密钥

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 会话级事件循环:engine/redis 客户端 lru_cache 单例与 asyncpg 连接绑定同一 loop
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

# authlib 官方存根不完整:AsyncOAuth2Client 的 httpx 继承方法(get/aclose)
# 运行时存在、存根未声明,provider 模块关闭 attr-defined(其余 strict 全开)
[[tool.mypy.overrides]]
module = "kongming.auth.providers.*"
disable_error_code = ["attr-defined"]

# asyncpg 无 py.typed 标记(直连仅测试连接一处消费,异常类 isinstance 判定不受影响)
[[tool.mypy.overrides]]
module = "kongming.datasource.tester"
disable_error_code = ["import-untyped"]

[tool.importlinter]
root_packages = ["kongming"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "auth 域不反向依赖业务域(ADR-003 回退路径前提)"
type = "forbidden"
source_modules = ["kongming.auth"]
# kongming.datasource=008、kongming.rag=009 落地的真实包名(基线期猜测名
# datasource_admin/rag_admin 曾使防线对真实包静默失效,R1 实证;009 清偿挂账)
forbidden_modules = ["kongming.chat", "kongming.rag", "kongming.datasource"]

[[tool.importlinter.contracts]]
name = "datascope 域不依赖 Web 框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = ["kongming.datascope"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "chat 领域模型/用例/端口/导出纯函数不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.chat.models",
    "kongming.chat.service",
    "kongming.chat.ports",
    "kongming.chat.export",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "system 领域模型/用例不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = ["kongming.system.models", "kongming.system.service", "kongming.system.ports"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "datasource 领域模型/用例/端口不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.datasource.models",
    "kongming.datasource.service",
    "kongming.datasource.ports",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "rag 领域模型/用例/端口不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.rag.models",
    "kongming.rag.service",
    "kongming.rag.ports",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "audit 领域模型/用例/端口不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = ["kongming.audit.models", "kongming.audit.service", "kongming.audit.ports"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "feedback 领域模型/用例/端口不依赖框架(宪法 Article II 领域纯净)"
type = "forbidden"
source_modules = [
    "kongming.feedback.models",
    "kongming.feedback.service",
    "kongming.feedback.ports",
]
forbidden_modules = ["fastapi", "sqlalchemy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kongming"]
