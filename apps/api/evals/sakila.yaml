# Sakila 影视租赁评估集；gold_sql 使用明确的 schema 限定。
# 题型: single_table / filter / aggregate / join_2table / join_3table / join_4plus
# 编写规范见 evals/README.md(tiebreaker/业务可读列/结果集 ≤1000/明细 LIMIT 100)

- id: sakila_smoke_001
  question: 有多少部影片
  gold_sql: SELECT COUNT(*) FROM tenant_sakila.film
  expected_tables: [film]
  category: aggregate
  smoke: true

- id: sakila_smoke_002
  question: 每个影片分类有多少部影片
  gold_sql: SELECT c.name, COUNT(*) FROM tenant_sakila.category c JOIN tenant_sakila.film_category fc ON c.category_id = fc.category_id GROUP BY c.name
  expected_tables: [category, film_category]
  category: join_2table
  smoke: true

- id: sakila_001
  question: 按客户ID排序,查询前100位客户的邮箱
  gold_sql: SELECT email FROM tenant_sakila.customer ORDER BY customer_id LIMIT 100
  expected_tables: [customer]
  category: single_table

- id: sakila_002
  question: 查询所有影片分类的名称
  gold_sql: SELECT name FROM tenant_sakila.category
  expected_tables: [category]
  category: single_table

- id: sakila_003
  question: 查询所有门店的编号
  gold_sql: SELECT store_id FROM tenant_sakila.store
  expected_tables: [store]
  category: single_table

- id: sakila_004
  question: 按影片ID排序,查询评分是NC-17的前100部影片
  gold_sql: SELECT title FROM tenant_sakila.film WHERE rating = 'NC-17' ORDER BY film_id LIMIT 100
  expected_tables: [film]
  category: filter

- id: sakila_005
  question: 按影片ID排序,查询租金大于3美元的前100部影片
  gold_sql: SELECT title FROM tenant_sakila.film WHERE rental_rate > 3 ORDER BY film_id LIMIT 100
  expected_tables: [film]
  category: filter

- id: sakila_006
  question: 按影片ID排序,查询时长超过120分钟的前100部影片
  gold_sql: SELECT title FROM tenant_sakila.film WHERE length > 120 ORDER BY film_id LIMIT 100
  expected_tables: [film]
  category: filter

- id: sakila_007
  question: 每位客户支付的总金额
  # 返回客户姓名，便于核对结果。
  gold_sql: SELECT c.first_name, c.last_name, SUM(p.amount) FROM tenant_sakila.payment p JOIN tenant_sakila.customer c ON p.customer_id = c.customer_id GROUP BY c.customer_id, c.first_name, c.last_name
  expected_tables: [payment, customer]
  category: aggregate

- id: sakila_008
  question: 租赁次数最多的前5位客户
  # 20 位客户的租赁次数均为 3；需要第二排序键保证顺序稳定。
  gold_sql: SELECT c.first_name, c.last_name, COUNT(*) FROM tenant_sakila.rental r JOIN tenant_sakila.customer c ON r.customer_id = c.customer_id GROUP BY c.customer_id, c.first_name, c.last_name ORDER BY COUNT(*) DESC, c.customer_id LIMIT 5
  expected_tables: [rental, customer]
  category: aggregate

- id: sakila_009
  question: 每个门店的库存数量
  gold_sql: SELECT store_id, COUNT(*) FROM tenant_sakila.inventory GROUP BY store_id
  expected_tables: [inventory]
  category: aggregate

- id: sakila_010
  question: 每位客户租了多少次
  gold_sql: SELECT c.first_name, c.last_name, COUNT(*) FROM tenant_sakila.rental r JOIN tenant_sakila.customer c ON r.customer_id = c.customer_id GROUP BY c.customer_id, c.first_name, c.last_name
  expected_tables: [rental, customer]
  category: aggregate

- id: sakila_011
  question: 影片租金的平均价格是多少
  # 平均租金保留两位小数。
  gold_sql: SELECT ROUND(AVG(rental_rate), 2) FROM tenant_sakila.film
  expected_tables: [film]
  category: aggregate

- id: sakila_012
  question: 每位演员参演了多少部影片
  # 返回姓名和完整聚合结果，共 603 行。
  gold_sql: SELECT a.first_name, a.last_name, COUNT(*) FROM tenant_sakila.actor a JOIN tenant_sakila.film_actor fa ON a.actor_id = fa.actor_id GROUP BY a.actor_id, a.first_name, a.last_name
  expected_tables: [actor, film_actor]
  category: aggregate

- id: sakila_013
  question: 按影片ID排序,查询前100部影片的标题和分类名称
  # 问题明确要求标题，结果包含 title。
  gold_sql: SELECT f.title, c.name FROM tenant_sakila.film f JOIN tenant_sakila.film_category fc ON f.film_id = fc.film_id JOIN tenant_sakila.category c ON fc.category_id = c.category_id ORDER BY f.film_id LIMIT 100
  expected_tables: [film, film_category, category]
  category: join_2table

- id: sakila_014
  question: 按客户ID和影片名排序,查询前100条客户租赁影片的记录,包含客户ID、客户姓名和影片名
  # 返回客户 ID 和姓名；同一客户重复租同一影片属于不同记录，不去重。
  gold_sql: SELECT r.customer_id, c.first_name || ' ' || c.last_name AS customer_name, f.title FROM tenant_sakila.customer c JOIN tenant_sakila.rental r ON c.customer_id = r.customer_id JOIN tenant_sakila.inventory i ON r.inventory_id = i.inventory_id JOIN tenant_sakila.film f ON i.film_id = f.film_id ORDER BY r.customer_id, f.title LIMIT 100
  expected_tables: [customer, rental, inventory, film]
  category: join_3table

- id: sakila_015
  question: 按演员ID和影片ID排序,查询前100条演员出演影片的记录,包含演员姓名和影片名
  # 返回演员姓名和影片名，并用第二排序键稳定结果顺序。
  gold_sql: SELECT a.first_name, a.last_name, f.title FROM tenant_sakila.actor a JOIN tenant_sakila.film_actor fa ON a.actor_id = fa.actor_id JOIN tenant_sakila.film f ON fa.film_id = f.film_id ORDER BY a.actor_id, f.film_id LIMIT 100
  expected_tables: [actor, film_actor, film]
  category: join_2table

- id: sakila_016
  question: 按支付ID排序,查询前100条客户支付记录,包含客户姓名、影片名和支付金额
  gold_sql: SELECT c.first_name, c.last_name, f.title, p.amount FROM tenant_sakila.payment p JOIN tenant_sakila.rental r ON p.rental_id = r.rental_id JOIN tenant_sakila.inventory i ON r.inventory_id = i.inventory_id JOIN tenant_sakila.film f ON i.film_id = f.film_id JOIN tenant_sakila.customer c ON p.customer_id = c.customer_id ORDER BY p.payment_id LIMIT 100
  expected_tables: [payment, rental, inventory, film, customer]
  category: join_4plus

- id: sakila_017
  question: 查询每个门店库存中各影片分类的库存数量
  gold_sql: SELECT i.store_id, c.name, COUNT(*) FROM tenant_sakila.inventory i JOIN tenant_sakila.film_category fc ON i.film_id = fc.film_id JOIN tenant_sakila.category c ON fc.category_id = c.category_id GROUP BY i.store_id, c.name
  expected_tables: [inventory, film_category, category]
  category: join_3table

- id: sakila_018
  question: 按分类名和演员ID排序,查询前100条演员与影片分类的对应关系,包含演员ID和演员姓名
  # 按分类名和演员 ID 排序，并返回演员 ID 与姓名。
  gold_sql: SELECT DISTINCT c.name, a.actor_id, a.first_name, a.last_name FROM tenant_sakila.actor a JOIN tenant_sakila.film_actor fa ON a.actor_id = fa.actor_id JOIN tenant_sakila.film_category fc ON fa.film_id = fc.film_id JOIN tenant_sakila.category c ON fc.category_id = c.category_id ORDER BY c.name, a.actor_id LIMIT 100
  expected_tables: [actor, film_actor, film_category, category]
  category: join_3table

- id: sakila_019
  question: 按客户ID和影片名排序,查询前100条客户租借影片含分类的记录,包含客户ID、客户姓名、影片名和分类名
  # 返回客户 ID、姓名、影片名和分类名；保留重复租赁记录。
  gold_sql: SELECT r.customer_id, c.first_name || ' ' || c.last_name AS customer_name, f.title, ca.name FROM tenant_sakila.customer c JOIN tenant_sakila.rental r ON c.customer_id = r.customer_id JOIN tenant_sakila.inventory i ON r.inventory_id = i.inventory_id JOIN tenant_sakila.film f ON i.film_id = f.film_id JOIN tenant_sakila.film_category fc ON f.film_id = fc.film_id JOIN tenant_sakila.category ca ON fc.category_id = ca.category_id ORDER BY r.customer_id, f.title, ca.name LIMIT 100
  expected_tables: [customer, rental, inventory, film, film_category, category]
  category: join_4plus

- id: sakila_020
  question: 按支付ID排序,查询前100条客户支付记录,包含客户姓名、影片名、分类和金额
  gold_sql: SELECT c.first_name, c.last_name, f.title, ca.name, p.amount FROM tenant_sakila.payment p JOIN tenant_sakila.rental r ON p.rental_id = r.rental_id JOIN tenant_sakila.inventory i ON r.inventory_id = i.inventory_id JOIN tenant_sakila.film f ON i.film_id = f.film_id JOIN tenant_sakila.film_category fc ON f.film_id = fc.film_id JOIN tenant_sakila.category ca ON fc.category_id = ca.category_id JOIN tenant_sakila.customer c ON p.customer_id = c.customer_id ORDER BY p.payment_id LIMIT 100
  expected_tables: [payment, rental, inventory, film, film_category, category, customer]
  category: join_4plus

- id: sakila_021
  question: 每个影片分类的平均租金
  # 平均租金保留两位小数，并返回分类名；结果共 16 行。
  gold_sql: SELECT c.name, ROUND(AVG(f.rental_rate), 2) FROM tenant_sakila.film f JOIN tenant_sakila.film_category fc ON f.film_id = fc.film_id JOIN tenant_sakila.category c ON fc.category_id = c.category_id GROUP BY c.name
  expected_tables: [film, film_category, category]
  category: aggregate

- id: sakila_022
  question: 哪个影片分类的影片最多,数量是多少
  # 返回类目名和影片数量；数量相同时按类目名排序。
  gold_sql: SELECT c.name, COUNT(*) AS cnt FROM tenant_sakila.category c JOIN tenant_sakila.film_category fc ON c.category_id = fc.category_id GROUP BY c.name ORDER BY cnt DESC, c.name LIMIT 1
  expected_tables: [category, film_category]
  category: aggregate

- id: sakila_023
  question: 有多少客户租过影片
  # rental 有多条同一客户的记录，使用 DISTINCT 统计租过影片的客户数。
  gold_sql: SELECT COUNT(DISTINCT customer_id) FROM tenant_sakila.rental
  expected_tables: [rental]
  category: aggregate

# 国家按 country_id 分组，并用该 ID 作为最后排序键，避免同名国家合并或顺序不定。

- id: 35ced065
  tenant: sakila
  question: 列出所有活跃客户的姓名、邮箱和注册日期，按注册日期降序排列，若注册日期相同则按客户ID升序排列，结果限制为100条。
  gold_sql: SELECT first_name, last_name, email, create_date FROM tenant_sakila.customer WHERE activebool = true ORDER BY
    create_date DESC, customer_id ASC LIMIT 100
  expected_tables: [customer]
  category: single_table

- id: 6183fe4b
  tenant: sakila
  question: 统计每个国家的城市数量，并按城市数量降序排列，数量相同时按国家名称升序排列
  # 使用 country_id 作为最后排序键，保证国家名相同时顺序稳定。
  gold_sql: SELECT c.country, COUNT(ci.city_id) AS city_count FROM tenant_sakila.country c JOIN tenant_sakila.city ci ON c.country_id
    = ci.country_id GROUP BY c.country_id, c.country ORDER BY city_count DESC, c.country ASC, c.country_id ASC
  expected_tables: [country, city]
  category: aggregate

- id: 381c7e34
  tenant: sakila
  question: 列出所有活跃客户的姓名、邮箱以及他们所属门店的经理姓名，按客户姓氏升序排列，结果限制为100条；若姓氏相同，则按客户ID升序排列。
  gold_sql: SELECT c.first_name, c.last_name, c.email, s.first_name AS manager_first_name, s.last_name AS manager_last_name
    FROM tenant_sakila.customer c JOIN tenant_sakila.store st ON c.store_id = st.store_id JOIN tenant_sakila.staff s ON st.manager_staff_id
    = s.staff_id WHERE c.activebool = true ORDER BY c.last_name, c.customer_id LIMIT 100
  expected_tables: [customer, store, staff]
  category: join_2table

- id: sakila_semantic_001
  question: 按月统计每个门店的租赁笔数和总支付金额，按月份、门店排序
  # 语义护栏实验室用例：事件时间按月、事件归属走 rental→staff→store、
  # 笔数按 rental 主键去重（payment 一对多不得放大计数）。
  gold_sql: SELECT date_trunc('month', r.rental_date) AS month, st.store_id, COUNT(DISTINCT r.rental_id) AS rental_count, SUM(p.amount) AS amount FROM tenant_sakila.rental r JOIN tenant_sakila.staff st ON r.staff_id = st.staff_id LEFT JOIN tenant_sakila.payment p ON p.rental_id = r.rental_id GROUP BY 1, 2 ORDER BY 1, 2
  expected_tables: [rental, staff, payment]
  category: aggregate

- id: sakila_semantic_002
  question: 每个门店的租赁笔数，按门店编号排序
  # 事件计数与门店归属：事件表自身 staff 外键路径。
  gold_sql: SELECT st.store_id, COUNT(*) AS rentals FROM tenant_sakila.rental r JOIN tenant_sakila.staff st ON r.staff_id = st.staff_id GROUP BY st.store_id ORDER BY st.store_id
  expected_tables: [rental, staff]
  category: aggregate

- id: sakila_semantic_003
  question: 按月统计租赁笔数，按月份排序
  # 事件时间口径：只使用事件表 rental 的发生时间。
  gold_sql: SELECT date_trunc('month', r.rental_date) AS month, COUNT(*) AS rentals FROM tenant_sakila.rental r GROUP BY 1 ORDER BY 1
  expected_tables: [rental]
  category: aggregate

- id: sakila_semantic_004
  question: 每个门店的租赁笔数和支付笔数，按门店编号排序
  # 一对多计数：rental 与 payment 关联后，两侧都按各自主键去重。
  gold_sql: SELECT st.store_id, COUNT(DISTINCT r.rental_id) AS rentals, COUNT(DISTINCT p.payment_id) AS payments FROM tenant_sakila.rental r JOIN tenant_sakila.staff st ON r.staff_id = st.staff_id JOIN tenant_sakila.payment p ON p.rental_id = r.rental_id GROUP BY st.store_id ORDER BY st.store_id
  expected_tables: [rental, staff, payment]
  category: aggregate
