- id: 381c7e34
  question: 列出所有活跃客户的姓名、邮箱以及他们所属门店的经理姓名，按客户姓氏升序排列，结果限制为100条；若姓氏相同，则按客户ID升序排列。
  gold_sql: SELECT c.first_name, c.last_name, c.email, s.first_name AS manager_first_name, s.last_name AS manager_last_name
    FROM tenant_sakila.customer c JOIN tenant_sakila.store st ON c.store_id = st.store_id JOIN tenant_sakila.staff s ON st.manager_staff_id
    = s.staff_id WHERE c.activebool = true ORDER BY c.last_name, c.customer_id LIMIT 100
  expected_tables:
  - tenant_sakila.customer
  - tenant_sakila.store
  - tenant_sakila.staff
  category: join_2table
  validation:
    exec_ok: true
    row_count: 100
    style_failures: []
    semantic_duplicate: false
    ok: true
- id: a91aca63
  question: 请列出所有在2007年1月完成支付、且租借影片的客户姓名（名和姓）、对应员工姓名（名和姓）以及影片标题，按支付时间倒序排列，结果限制为100条，并确保相同支付时间下按payment_id升序排列。
  gold_sql: SELECT c.first_name AS customer_first_name, c.last_name AS customer_last_name, s.first_name AS staff_first_name,
    s.last_name AS staff_last_name, f.title FROM tenant_sakila.payment_p2007_01 p JOIN tenant_sakila.customer c ON p.customer_id
    = c.customer_id JOIN tenant_sakila.staff s ON p.staff_id = s.staff_id JOIN tenant_sakila.rental r ON p.rental_id = r.rental_id
    JOIN tenant_sakila.inventory i ON r.inventory_id = i.inventory_id JOIN tenant_sakila.film f ON i.film_id = f.film_id ORDER
    BY p.payment_date DESC, p.payment_id ASC LIMIT 100
  expected_tables:
  - tenant_sakila.payment_p2007_01
  - tenant_sakila.customer
  - tenant_sakila.staff
  - tenant_sakila.rental
  - tenant_sakila.inventory
  - tenant_sakila.film
  category: join_3table
  validation:
    exec_ok: true
    row_count: 0
    style_failures: []
    semantic_duplicate: false
    ok: true
