# BM25 正式对照题集:独立编写,不用调试题。groups 分三类;
# precise 组必带 subtype(number/term/brand/standard_no),覆盖门禁按
# bm25_eval.yaml 的 min_subtype_counts 检查;brand 涵盖品牌型号与
# 卡号/券码等标识编号,standard_no 为 GB 标准编号。
dataset:
  tenant: default
  datasource_key: default
  corpus_dir: corpus
  top_k: 5
  min_questions: 60
  min_multihop: 20
questions:
  # ── 精确词:数字/金额/期限 15 ──
  - id: f_prec_01
    question: 所有影片的基础租期是多少天?
    category: single_hop
    groups: [precise]
    subtype: number
    gold:
      - doc: 租赁规则.md
        snippets: ["所有影片基础租期为 7 天"]
  - id: f_prec_02
    question: 基础租期续借一次可以延长几天?
    category: single_hop
    groups: [precise]
