# 检索质量评测集(retrieval-eval spec):语料=corpus/ 下 md 文件(幂等上传),
# gold=文档名+必含文本片段(运行时经 chunk_document 映射父块,不硬编码块 id)。
# category 三类:single_hop / multi_hop_doc(同文档多跳)/ multi_hop_cross(跨文档多跳)。
dataset:
  tenant: default   # default/default=恒可用数据源形态(CI 空库亦可跑,零新增数据源登记)
  datasource_key: default
  corpus_dir: corpus
  top_k: 5
  min_questions: 12
  min_multihop: 5
questions:
  # ── 单跳 ──
  - id: retr_sakila_001
    question: 所有影片的基础租期是多少天?
    category: single_hop
    gold:
      - doc: 租赁规则.md
        snippets: ["基础租期为 7 天"]
  - id: retr_sakila_002
    question: 逾期归还的逾期费怎么计算?
    category: single_hop
    gold:
      - doc: 租赁规则.md
        snippets: ["每日每部 0.5 元"]
  - id: retr_sakila_003
    question: 累计消费满多少可以成为金卡会员?
    category: single_hop
    gold:
      - doc: 会员等级政策.md
        snippets: ["满 500 元为金卡会员"]
  - id: retr_sakila_004
    question: 对逾期费有异议怎么处理?
    category: single_hop
    gold:
      - doc: 逾期处理流程.md
        snippets: ["发起申诉"]
  - id: retr_sakila_005
    question: 银卡会员租借有什么优惠?
    category: single_hop
    gold:
      - doc: 会员权益说明.md
        snippets: ["九折优惠"]
  - id: retr_sakila_006
    question: 逾期超过 30 天的影片怎么处理?
    category: single_hop
    gold:
      - doc: 租赁规则.md
        snippets: ["按遗失赔偿处理"]
  # ── 跨文档多跳 ──
  - id: retr_sakila_007
    question: 金卡会员一次租借最多能借多久?
    category: multi_hop_cross
    gold:
      - doc: 会员权益说明.md
        snippets: ["基础租期延长 3 天"]
      - doc: 租赁规则.md
        snippets: ["基础租期为 7 天"]
  - id: retr_sakila_008
    question: 铜卡会员消费满多少升级为银卡?升级后租借打几折?
    category: multi_hop_cross
    gold:
      - doc: 会员等级政策.md
        snippets: ["升级为银卡"]
      - doc: 会员权益说明.md
        snippets: ["九折优惠"]
  - id: retr_sakila_009
