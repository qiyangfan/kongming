# Olist 多轮上下文评估集——四类上下文依赖覆盖(指代/省略/排序延续/过滤追加)

- id: olist_multiturn_001
  category: multi_turn
  turns:
    - question: 支付总金额最高的前5种支付方式及其总金额
      # 支付方式名作为金额相同时的排序键，保证结果顺序稳定。
      gold_sql: SELECT payment_type, SUM(payment_value) FROM tenant_olist.order_payments GROUP BY payment_type ORDER BY SUM(payment_value) DESC, payment_type LIMIT 5
    - question: 这些支付方式各自的支付笔数是多少
      gold_sql: SELECT payment_type, COUNT(*) FROM tenant_olist.order_payments WHERE payment_type IN (SELECT payment_type FROM tenant_olist.order_payments GROUP BY payment_type ORDER BY SUM(payment_value) DESC, payment_type LIMIT 5) GROUP BY payment_type ORDER BY payment_type

- id: olist_multiturn_002
  category: multi_turn
  turns:
    - question: 查询已发货的订单
      gold_sql: SELECT order_id FROM tenant_olist.orders WHERE order_status = 'shipped' ORDER BY order_id LIMIT 100
    - question: 这些订单里评论评分是5分的有多少个
      gold_sql: SELECT COUNT(*) FROM tenant_olist.order_reviews r WHERE r.review_score = 5 AND r.order_id IN (SELECT order_id FROM tenant_olist.orders WHERE order_status = 'shipped')

- id: olist_multiturn_003
  category: multi_turn
  turns:
    - question: 每个州的客户数量
      gold_sql: SELECT customer_state, COUNT(*) FROM tenant_olist.customers GROUP BY customer_state
    - question: 按客户记录数从多到少排序,只看前5名
      # customers 表可能有同一客户多行；“记录数”应使用 COUNT(*)，而非去重客户数。
      gold_sql: SELECT customer_state, COUNT(*) FROM tenant_olist.customers GROUP BY customer_state ORDER BY COUNT(*) DESC, customer_state LIMIT 5

- id: olist_multiturn_004
  category: multi_turn
  turns:
    - question: 每种商品类目有多少个商品(类目取 product_category_name 原名)
      # 明确使用原始类目名，区别于英文翻译名。按类目分组控制结果集大小；NULL 类目不参与后续查询。
      gold_sql: SELECT p.product_category_name, COUNT(*) FROM tenant_olist.products p WHERE p.product_category_name IS NOT NULL GROUP BY p.product_category_name
    - question: 这些类目中商品数最多的前5个,各自的英文翻译名和商品数是什么
      # 后续问句要求英文翻译名和商品数，因此结果投影包含这两列。
      gold_sql: SELECT t.product_category_name_english, COUNT(*) FROM tenant_olist.products p JOIN tenant_olist.category_translation t ON p.product_category_name = t.product_category_name GROUP BY t.product_category_name_english ORDER BY COUNT(*) DESC, t.product_category_name_english LIMIT 5

- id: olist_multiturn_005
  category: multi_turn
  # 后续问题只查询上一轮排名前 10 的城市。
  turns:
    - question: 订单数量最多的前10个城市
      gold_sql: SELECT c.customer_city, COUNT(*) FROM tenant_olist.orders o JOIN tenant_olist.customers c ON o.customer_id = c.customer_id GROUP BY c.customer_city ORDER BY COUNT(*) DESC, c.customer_city LIMIT 10
    - question: 这些城市的客户记录总数是多少(按客户表行数计数,无论是否下过单)
      # “客户记录数”按 customers 表行数统计；COUNT(*) 为 35042，去重客户数为 33801。
      gold_sql: SELECT COUNT(*) FROM tenant_olist.customers WHERE customer_city IN (SELECT c.customer_city FROM tenant_olist.orders o JOIN tenant_olist.customers c ON o.customer_id = c.customer_id GROUP BY c.customer_city ORDER BY COUNT(*) DESC, c.customer_city LIMIT 10)

- id: olist_multiturn_006
  category: multi_turn
  # 后续问题只查询上一轮筛出的前 10 个订单。
  turns:
    - question: 运费总额最高的前10个订单及其运费总额
      gold_sql: SELECT order_id, SUM(freight_value) FROM tenant_olist.order_items GROUP BY order_id ORDER BY SUM(freight_value) DESC, order_id LIMIT 10
    - question: 这些订单的支付总金额是多少
      gold_sql: SELECT SUM(payment_value) FROM tenant_olist.order_payments WHERE order_id IN (SELECT order_id FROM tenant_olist.order_items GROUP BY order_id ORDER BY SUM(freight_value) DESC, order_id LIMIT 10)
