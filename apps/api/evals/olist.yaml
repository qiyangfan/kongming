# Olist 租户评估集(电商订单,016)——gold_sql 显式 schema 限定,直连可执行
# 9 表: orders / order_items / customers / order_payments / order_reviews /
#        products / sellers / geolocation / category_translation
# 编写规范见 evals/README.md;olist 电商语义天然多维,聚合题结果集均 ≤1000

- id: olist_smoke_001
  question: 一共有多少个订单
  gold_sql: SELECT COUNT(*) FROM tenant_olist.orders
  expected_tables: [orders]
  category: aggregate
  smoke: true

- id: olist_smoke_002
  question: 每种支付方式的支付总金额
  gold_sql: SELECT payment_type, SUM(payment_value) FROM tenant_olist.order_payments GROUP BY payment_type
  expected_tables: [order_payments]
  category: aggregate
  smoke: true

- id: olist_001
  question: 按客户ID排序,查询前100个客户所在的城市
  gold_sql: SELECT customer_city FROM tenant_olist.customers ORDER BY customer_id LIMIT 100
  expected_tables: [customers]
  category: single_table

- id: olist_002
  question: 查询所有的订单状态有哪些
  gold_sql: SELECT DISTINCT order_status FROM tenant_olist.orders
  expected_tables: [orders]
  category: single_table

- id: olist_003
  question: 按卖家ID排序,查询前100个卖家所在的城市
  gold_sql: SELECT seller_city FROM tenant_olist.sellers ORDER BY seller_id LIMIT 100
  expected_tables: [sellers]
  category: single_table

- id: olist_004
  question: 按订单ID排序,查询前100个已发货的订单
  gold_sql: SELECT order_id FROM tenant_olist.orders WHERE order_status = 'shipped' ORDER BY order_id LIMIT 100
  expected_tables: [orders]
  category: filter

- id: olist_005
  question: 按评论ID排序,查询前100条评分为5分的订单评论
  gold_sql: SELECT review_id FROM tenant_olist.order_reviews WHERE review_score = 5 ORDER BY review_id LIMIT 100
  expected_tables: [order_reviews]
  category: filter

- id: olist_006
  question: 按商品ID排序,查询前100个重量超过10000克的商品
  gold_sql: SELECT product_id FROM tenant_olist.products WHERE product_weight_g > 10000 ORDER BY product_id LIMIT 100
  expected_tables: [products]
  category: filter

- id: olist_007
  question: 每种订单状态有多少个订单
  gold_sql: SELECT order_status, COUNT(*) FROM tenant_olist.orders GROUP BY order_status
  expected_tables: [orders]
  category: aggregate

- id: olist_008
  question: 订单评论的平均评分是多少
  gold_sql: SELECT AVG(review_score) FROM tenant_olist.order_reviews
  expected_tables: [order_reviews]
  category: aggregate

- id: olist_009
  question: 每个州有多少客户
  gold_sql: SELECT customer_state, COUNT(*) FROM tenant_olist.customers GROUP BY customer_state
  expected_tables: [customers]
  category: aggregate

- id: olist_010
  question: 每种分期期数的订单支付有多少笔
  gold_sql: SELECT payment_installments, COUNT(*) FROM tenant_olist.order_payments GROUP BY payment_installments
  expected_tables: [order_payments]
  category: aggregate

- id: olist_011
  question: 运费总额最高的前10个订单及其运费总额
  # 原「每订单运费」98666 行超结果集上限,改 top-N(tiebreaker 保确定)
  gold_sql: SELECT order_id, SUM(freight_value) FROM tenant_olist.order_items GROUP BY order_id ORDER BY SUM(freight_value) DESC, order_id LIMIT 10
  expected_tables: [order_items]
  category: aggregate

- id: olist_012
  question: 每种商品类目英文翻译对应多少商品
  gold_sql: SELECT t.product_category_name_english, COUNT(*) FROM tenant_olist.products p JOIN tenant_olist.category_translation t ON p.product_category_name = t.product_category_name GROUP BY t.product_category_name_english
  expected_tables: [products, category_translation]
  category: join_2table

- id: olist_013
  question: 按订单ID排序,查询前100条订单的支付方式和支付金额
  gold_sql: SELECT o.order_id, p.payment_type, p.payment_value FROM tenant_olist.orders o JOIN tenant_olist.order_payments p ON o.order_id = p.order_id ORDER BY o.order_id, p.payment_sequential LIMIT 100
  expected_tables: [orders, order_payments]
  category: join_2table

- id: olist_014
  question: 评论得分与订单状态的关系,每种状态下评论的平均分
  gold_sql: SELECT o.order_status, AVG(r.review_score) FROM tenant_olist.orders o JOIN tenant_olist.order_reviews r ON o.order_id = r.order_id GROUP BY o.order_status
  expected_tables: [orders, order_reviews]
  category: join_2table

- id: olist_015
  question: 订单数量最多的前10个城市
  # 原「每城市订单数」4119 行超结果集上限,改 top-N(tiebreaker 保确定)
  gold_sql: SELECT c.customer_city, COUNT(*) FROM tenant_olist.orders o JOIN tenant_olist.customers c ON o.customer_id = c.customer_id GROUP BY c.customer_city ORDER BY COUNT(*) DESC, c.customer_city LIMIT 10
  expected_tables: [orders, customers]
  category: join_2table

- id: olist_016
  question: 每种类目商品的平均价格和平均运费
  gold_sql: SELECT p.product_category_name, AVG(i.price), AVG(i.freight_value) FROM tenant_olist.order_items i JOIN tenant_olist.products p ON i.product_id = p.product_id GROUP BY p.product_category_name
  expected_tables: [order_items, products]
  category: join_2table
