[project]
name = "kongming-agent"
version = "0.1.0"
description = "Kongming Agent 面:零凭证、纯脑力(LangGraph)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langgraph>=0.2.60",
    "openai>=1.60",                  # 兼容通义/DeepSeek 的 openai 协议客户端
    "httpx>=0.28",                   # 回调控制面
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest 惯例

[tool.mypy]
strict = true
python_version = "3.13"

[tool.importlinter]
root_packages = ["kongming_agent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Agent 面禁止触碰任何数据库驱动/凭证(ADR-002 纵深一层)"
type = "forbidden"
source_modules = ["kongming_agent"]
forbidden_modules = ["asyncpg", "sqlalchemy", "psycopg", "redis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kongming_agent"]
