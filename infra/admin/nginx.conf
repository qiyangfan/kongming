# 孔明管理台托管示例(同源 /api 反代 + CSP)。部署时由反代提供 DNS/TLS。
# 浏览器只访问本 origin;API 不开放 CORS。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 与 KM_RAG_BINARY_UPLOAD_MAX_BYTES(默认 10MB)留余量;默认 1m 会 413
    client_max_body_size 12m;

    # script-src 的 sha256 对应 apps/admin/index.html 的首帧内联脚本;
    # 改脚本须同步,apps/api/tests/test_admin_deploy_assets.py 会重算校验。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CS4jGzm0tgTARb1hoznBfbfn83BOjpLWdaQzWjBhFVM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # /api 前缀剥离到 apps/api 根路由;WebSocket 与子协议头一并透传
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        # 控制台的 reindex/元数据同步是同步长任务,默认 60s 会 504
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
